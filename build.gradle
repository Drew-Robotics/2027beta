import org.wpilib.deployutils.deploy.artifact.ArtifactDeployTask
import org.wpilib.deployutils.deploy.target.discovery.TargetDiscoveryTask

plugins {
    id "java"
    id "application"
    id "org.wpilib.GradleRIO" version "2027.0.0-alpha-7"
    // Departs from the template: the analyzers wired at the end of this file.
    id "com.diffplug.spotless" version "8.4.0"
    id "com.github.spotbugs" version "6.4.12"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def ROBOT_MAIN_CLASS = "first.Main"

// Define my targets (SystemCore) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        systemcore(getTargetTypeClass('SystemCore')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.wpilib.getTeamNumber()
            // Use the default systemcore host name. This must be called after setting team
            // as happens on the line above
            useDefaultSystemcoreHostName()
            debug = project.wpilib.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                wpilibJava(getArtifactTypeClass('WPILibJavaArtifact')) {
                    // Set to true to use debug including JNI, which will drastically impact performance.
                    debugJni = false

                    // Departs from the template: see src/main/native/revshim. wpiutil comes
                    // first because the shim forwards a symbol into it and the JVM loads it
                    // RTLD_LOCAL, where a preloaded library cannot see it; this is the copy on
                    // java.library.path, not /usr/lib's, so the process holds only one wpiutil.
                    javaCommand = "LD_PRELOAD=/home/systemcore/wpilib/third-party/lib/libwpiutil.so:/home/systemcore/deploy/librevshim.so /usr/bin/java"
                }

                // Departs from the template: the aarch64 shim the line above preloads.
                revShim(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/native/revshim/linuxsystemcore')
                    directory = '/home/systemcore/deploy'
                    deleteOldFiles = false
                }

                // Static files artifact
                wpilibStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/systemcore/deploy'
                    deleteOldFiles = false // Change to true to delete files on systemcore that no
                                           // longer exist in deploy directory of this project
                }
            }
        }
    }
}

// Departs from the template: the SystemCore image ships /usr/lib/libMrcLib.so and the HAL calls
// MRC_CHECK_API_VERSION() before it prints anything, so an image older than the WPILib being
// deployed aborts into a three-second crash loop that nothing warns about at build time. The image
// and the WPILib are a version pair, and this is the only place the two numbers meet.
def mrcLibVersion = wpi.versions.mrcLibVersion.get()

// MRC_API_VERSION is in the mrclib headers, so the requested number is whatever the WPILib on the
// build classpath was compiled against rather than a table this file would have to keep current.
def mrcHeaders = configurations.detachedConfiguration(
    dependencies.create("org.wpilib.mrclib:mrclib-cpp:${mrcLibVersion}:headers@zip"))

def discoverSystemcore = tasks.named('discoversystemcore', TargetDiscoveryTask)

tasks.register('mrcApiPreflight') {
    group = 'wpilib'
    description = 'Checks the SystemCore image accepts the MRC API version this build requires'
    dependsOn discoverSystemcore

    doLast {
        def requested = null
        try {
            new java.util.zip.ZipFile(mrcHeaders.singleFile).withCloseable { zip ->
                def header = zip.getInputStream(zip.getEntry('mrclib/ApiVersion.h')).getText('UTF-8')
                def define = header =~ /(?m)^#define\s+MRC_API_VERSION\s+(\d+)/
                if (define) {
                    requested = define[0][1] as int
                }
            }
        } catch (Exception e) {
            logger.warn("MRC preflight skipped: mrclib ${mrcLibVersion} headers unreadable (${e.message}).")
            return
        }
        if (requested == null) {
            logger.warn("MRC preflight skipped: mrclib ${mrcLibVersion} declares no MRC_API_VERSION.")
            return
        }

        // isAvailable(), not the getter: getActiveContext() throws rather than answering null,
        // which would fail a deploy the check could not run against.
        def discovery = discoverSystemcore.get()
        if (!discovery.available) {
            logger.warn('MRC preflight skipped: the SystemCore was not discovered.')
            return
        }

        // `accepts` is exactly the HAL's own check, MRC_CheckApiVersion(MRC_API_VERSION), so this
        // asks no more than the robot program will. `ceiling` is only there to name a number in
        // the failure, which is why it need not look above what we asked for. MRC_Bool is uint8_t.
        // stderr is folded in because a box that cannot answer says why only on stderr.
        def probe = 'python3 -c \'import ctypes; ' +
            'f = ctypes.CDLL("/usr/lib/libMrcLib.so").MRC_CheckApiVersion; ' +
            'f.argtypes = [ctypes.c_uint32]; f.restype = ctypes.c_uint8; ' +
            "print(\"mrc-api accepts=%d ceiling=%d\" % (f(${requested}), " +
            "max([v for v in range(${requested}) if f(v)], default=-1)))' 2>&1"
        def answer = discovery.activeContext.execute(probe)?.result ?: ''
        def reply = answer =~ /mrc-api accepts=(\d) ceiling=(-?\d+)/
        if (!reply) {
            // A check that could not run must not block a deploy that would otherwise work.
            logger.warn("MRC preflight skipped: ${discovery.activeContext.friendlyString()} did not " +
                "answer the probe. It said: ${answer.trim()}")
            return
        }

        if (reply[0][1] == '1') {
            logger.lifecycle("MRC API ${requested} requested, and the image accepts it.")
            return
        }
        def ceiling = reply[0][2] as int
        throw new GradleException(
            "MRC API mismatch: this build needs ${requested} (mrclib ${mrcLibVersion}) and the " +
            (ceiling < 0 ? 'image accepts no version at all' : "image accepts up to ${ceiling}") +
            '. Nothing was deployed. The OS image and WPILib are a pair — reflash the SystemCore ' +
            'from LimelightVision/systemcore-os-public, or move the WPILib pin back to an alpha ' +
            'the image accepts.')
    }
}

// Every file copy and every remote command on the deploy path is an ArtifactDeployTask, the program
// kill included, so gating the type is what puts the failure before anything on the device is
// touched. An unreachable bench never gets this far: discovery fails first, as it already did.
tasks.withType(ArtifactDeployTask).configureEach {
    dependsOn 'mrcApiPreflight'
}

// Departs from the template: REVLib alpha-6's native imports two symbols no WPILib this project
// can compile against exports, and calls two more with signatures that have since changed. Either
// one kills the JVM. src/main/native/revshim bridges both; every JVM that touches REVLib preloads
// it. Delete all of this when REVLib publishes against a current WPILib.
def revShimDesktop = file('src/main/native/revshim/linuxx86-64/librevshim.so').absolutePath

def deployArtifact = deploy.targets.systemcore.artifacts.wpilibJava

// Set to true to use debug for simulation including JNI
wpi.java.runSimWithDebugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    systemcoreDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.systemcore)
    systemcoreDebug wpi.java.vendor.jniDebug(wpi.platforms.systemcore)

    systemcoreRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.vendor.jniRelease(wpi.platforms.systemcore)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // -PnoRevShim is the check that says whether the shim is still needed: without it, a green
    // WiringTest means REVLib's native binds on its own and src/main/native/revshim can go.
    if (!project.hasProperty('noRevShim')) {
        environment 'LD_PRELOAD', revShimDesktop
    }
    // A fresh JVM per test class. The HAL, the alert table and the data log are all process-wide
    // and started once: a class that stands up a real Robot claims the data log for the rest of
    // the JVM, and the next class to want its own gets the first one's.
    forkEvery = 1
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// The characterisation harness, pointed at a file a human can drag into the SysId analyser rather
// than at a temporary directory. It is the same run the pipeline test asserts on, so a log that
// opens here is the log CI checked. Not wired into `check`: it is a tool, not a gate.
tasks.register('sysidLog', Test) {
    group = 'verification'
    description = 'Runs the characterisation routines in simulation and writes logs/sysid-simulation.wpilog'
    // A registered Test task inherits none of the built-in one's wiring.
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching 'first.robot.sysid.CharacterisationTest' }
    systemProperty 'sysid.logDir', file('logs').absolutePath
    testLogging { showStandardStreams = true }
    // The log is the output and it is written every time; nothing about it is up to date.
    outputs.upToDateWhen { false }
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

application.mainClass = ROBOT_MAIN_CLASS

deployArtifact.configureApplication(application)
wpi.java.configureApplication(application)
wpi.java.configureTestTasks(test)
wpi.java.configureTestTasks(tasks.named('sysidLog').get())

// Departs from the template: simulation runs through the application plugin's JavaExec tasks now,
// and they need the same preload as the tests.
tasks.withType(JavaExec).configureEach {
    environment 'LD_PRELOAD', revShimDesktop
}

jar {
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
}

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

// Departs from the template: allwpilib's own styleguide, minus the two modules that would
// demand Javadoc on the first public method written here.
apply plugin: 'checkstyle'
apply plugin: 'pmd'

checkstyle {
    toolVersion = '13.4.0'
    configDirectory = file('styleguide')
}

pmd {
    toolVersion = '7.23.0'
    consoleOutput = true
    ruleSetFiles = files('styleguide/pmd-ruleset.xml')
    ruleSets = []
}

spotbugs {
    excludeFilter = file('styleguide/spotbugs-exclude.xml')
    // allwpilib runs the analysis at this depth, and the exclusions above were written against it.
    effort = com.github.spotbugs.snom.Effort.MAX
}

spotless {
    java {
        target fileTree('src') { include '**/*.java' }
        toggleOffOn()
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// The v3 test base is a carry, and linting somebody else's file only teaches people to edit it.
tasks.matching { it.name in ['checkstyleTest', 'pmdTest', 'spotbugsTest'] }.configureEach {
    enabled = false
}

// One report reads top-down only if the cheap checks have already run.
tasks.withType(Test).configureEach {
    mustRunAfter 'spotlessCheck', 'checkstyleMain', 'pmdMain', 'spotbugsMain'
}

// Departs from the template: nothing in WPILib generates build metadata, and a log that cannot be
// attributed to a commit cannot be read.
def buildMetadataDir = layout.buildDirectory.dir('generated/sources/buildmetadata/java/main')

tasks.register('generateBuildMetadata') {
    def outputDir = buildMetadataDir
    def teamNumber = project.wpilib.getTeamNumber()
    def vendordeps = fileTree('vendordeps') { include '*.json' }
    def projectRoot = projectDir

    inputs.files(vendordeps)
    outputs.dir(outputDir)
    // The git SHA and the dirty flag change without any declared input changing.
    outputs.upToDateWhen { false }

    doLast {
        def git = { String... argv ->
            try {
                def process = new ProcessBuilder(argv).directory(projectRoot).start()
                def text = process.inputStream.getText('UTF-8')
                process.waitFor()
                return process.exitValue() == 0 ? [ok: true, text: text.trim()] : [ok: false, text: '']
            } catch (Exception ignored) {
                return [ok: false, text: '']
            }
        }
        // Keyed on the vendor's own name rather than the filename, which carries a version and
        // changes every time the JSON is re-imported.
        def declared = vendordeps.files.collectEntries {
            def json = new groovy.json.JsonSlurper().parse(it)
            [(json.name): json.version]
        }
        def vendorVersion = { String name -> declared.getOrDefault(name, 'unknown') }

        def sha = git('git', 'rev-parse', 'HEAD')
        def branch = git('git', 'rev-parse', '--abbrev-ref', 'HEAD')
        def porcelain = git('git', 'status', '--porcelain')
        def dirty = !porcelain.ok || !porcelain.text.isEmpty()

        def body = """\
// Generated by the generateBuildMetadata Gradle task. Do not edit and do not commit.

package first.robot;

public final class BuildMetadata {
  public static final String GIT_SHA = "${sha.ok ? sha.text : 'unknown'}";
  public static final boolean GIT_DIRTY = ${dirty};
  public static final String BRANCH = "${branch.ok ? branch.text : 'unknown'}";
  public static final String BUILD_TIME = "%s";
  public static final String REVLIB_VERSION = "${vendorVersion('REVLib')}";
  public static final String PHOENIX_VERSION = "${vendorVersion('CTRE-Phoenix (v6)')}";
  public static final int TEAM_NUMBER = ${teamNumber};

  private BuildMetadata() {}
}
"""
        def target = new File(outputDir.get().asFile, 'first/robot')
        target.mkdirs()
        def file = new File(target, 'BuildMetadata.java')

        // Rewriting the timestamp alone recompiles the whole source set for a build that produced
        // identical classes, so on a committed tree it is kept as it was. A dirty tree is restamped
        // every time: the SHA no longer distinguishes two builds, so the timestamp has to.
        def stamped = { String time -> String.format(body, time) }
        def previous = file.exists() ? file.text : null
        def strip = { String text -> text?.replaceAll(/(?m)^.*BUILD_TIME.*$/, '') }
        if (dirty || strip(previous) != strip(stamped(''))) {
            file.text = stamped(java.time.Instant.now().toString())
        }
    }
}

sourceSets.main.java.srcDir buildMetadataDir
tasks.named('compileJava') { dependsOn 'generateBuildMetadata' }
